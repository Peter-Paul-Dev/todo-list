<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
                <h2>Welcome, User</h2>
            
                <div class="projects">
                    <div class="header">
                        <h3>My Projects</h3>
                        <div class="buttons">
                            <button command="show-modal" commandfor="add-task">Create New Task</button>
                                <dialog id="add-task">
                                    <form action="" method="get" id="add-new-task">
                                        <fieldset>
                                            <legend>Create New Task</legend>
                                            <p>Fields with asterisks (*) are required</p>

                                            <div>
                                                <label for="task-title">Title*</label>
                                                <input type="text" name="title" id="task-title" required>
                                            </div>

                                            <div>
                                                <label for="task-due-date">Due Date*</label>
                                                <input type="text" name="due-date" id="task-due-date" required>
                                            </div>

                                            <div>
                                                <label for="task-description">Description</label>
                                                <input type="text" name="description" id="task-description">
                                            </div>

                                            <div>
                                                <label for="task-priority">Priority</label>
                                                <input type="text" name="priority" id="task-priority">
                                            </div>

                                            <div>
                                                <label for="task-notes">Notes</label>
                                                <input type="text" name="notes" id="task-notes">
                                            </div>
                                        </fieldset>
                                    </form>
                                    
                                    <button class="close-button" commandfor="add-task" command="close">X</button>
                                </dialog>

                            <button command="show-modal" commandfor="add-project">Create New Project</button>
                                <dialog id="add-project">
                                    <form action="" method="get" id="add-new-project">
                                        <legend>Create New Project</legend>
                                        <p>Fields marked with asterisks (*) are required</p>

                                        <div>
                                            <label for="project-title">Title</label>
                                            <input type="text" name="title" id="project-title">
                                        </div>
                                    </form>
                                    <button class="close-button" commandfor="add-project" command="close">X</button>
                                </dialog>
                        </div>
                    </div>
                </div>
            
            <div class="technical-section">
                <div>
                    <h4>Settings</h4>
                </div>

                <div>
                    <h4>Support</h4>
                </div>

                <div>
                    <h4>Privacy</h4>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
